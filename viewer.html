<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Screenshot Result</title>
  <style>
    :root {
      --bg: #f4f6f8;
      --card-bg: #ffffff;
      --text: #18181b;
      --text-muted: #71717a;
      --btn-bg: #2563eb;
      --btn-hover: #1d4ed8;
      --border: #e4e4e7;
    }

    [data-theme="dark"] {
      --bg: #09090b;
      --card-bg: #18181b;
      --text: #fafafa;
      --text-muted: #a1a1aa;
      --btn-bg: #3b82f6;
      --btn-hover: #2563eb;
      --border: #27272a;
    }

    * {
      box-sizing: border-box;
      transition: background 0.25s, color 0.25s;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .toolbar {
      position: sticky;
      top: 15px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      padding: 10px 20px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.15);
      border-radius: 50px;
      margin-bottom: 25px;
      display: flex;
      gap: 15px;
      align-items: center;
      z-index: 1000;
    }

    .download-btn {
      padding: 8px 20px;
      font-size: 14px;
      font-weight: 600;
      background: var(--btn-bg);
      color: white;
      border: none;
      border-radius: 20px;
      cursor: pointer;
    }

    .download-btn:hover {
      background: var(--btn-hover);
    }

    .theme-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 50%;
      width: 32px;
      height: 32px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
    }

    #preview {
      max-width: 90%;
      box-shadow: 0 4px 25px rgba(0,0,0,0.25);
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--card-bg);
    }
  </style>
</head>
<body>

  <div class="toolbar">
    <span id="status">Stitching full image...</span>
    <button id="downloadBtn" class="download-btn" style="display: none;">⬇ Download PNG</button>
    <button id="themeToggle" class="theme-btn" title="Toggle theme">🌙</button>
  </div>

  <img id="preview" />

  <script src="viewer.js"></script>
</body>
</html>
