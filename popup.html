<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    :root {
      --bg-main: #ffffff;
      --bg-header: #18181b;
      --text-header: #ffffff;
      --text-main: #18181b;
      --text-muted: #71717a;
      --block-empty: #e4e4e7;
      --block-done: #18181b;
      --block-active: #2563eb;
      --note-bg: #fef3c7;
      --note-border: #f59e0b;
      --note-text: #92400e;
      --toggle-bg: rgba(255, 255, 255, 0.15);
      --toggle-hover: rgba(255, 255, 255, 0.25);
      --border-color: #e4e4e7;
    }

    [data-theme="dark"] {
      --bg-main: #18181b;
      --bg-header: #09090b;
      --text-header: #fafafa;
      --text-main: #f4f4f5;
      --text-muted: #a1a1aa;
      --block-empty: #27272a;
      --block-done: #3b82f6;
      --block-active: #60a5fa;
      --note-bg: #2e2616;
      --note-border: #f59e0b;
      --note-text: #fde68a;
      --toggle-bg: rgba(255, 255, 255, 0.1);
      --toggle-hover: rgba(255, 255, 255, 0.2);
      --border-color: #27272a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      transition: background-color 0.25s ease, color 0.25s ease;
    }

    body {
      width: 320px;
      background: var(--bg-main);
      color: var(--text-main);
      overflow: hidden;
    }

    .header {
      background: var(--bg-header);
      color: var(--text-header);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }

    .header-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      font-weight: 600;
    }

    .theme-toggle-btn {
      background: var(--toggle-bg);
      border: none;
      color: #fff;
      font-size: 14px;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: 0.2s ease;
    }

    .theme-toggle-btn:hover {
      background: var(--toggle-hover);
      transform: scale(1.08);
    }

    .content {
      padding: 16px;
    }

    .status-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .percent-badge {
      color: var(--block-active);
      font-weight: 700;
      font-size: 14px;
    }

    .blocks-container {
      display: flex;
      gap: 5px;
      margin-bottom: 15px;
      flex-wrap: wrap;
    }

    .block {
      flex: 1;
      min-width: 13px;
      height: 16px;
      background: var(--block-empty);
      border-radius: 4px;
      transition: background 0.2s ease, transform 0.2s ease;
    }

    .block.active {
      background: var(--block-active);
      transform: scale(1.06);
    }

    .block.done {
      background: var(--block-done);
    }

    /* منطقة الأزرار (Buttons) */
    .controls {
      margin-bottom: 14px;
    }

    .btn {
      padding: 9px 14px;
      font-size: 13px;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: transform 0.15s ease, opacity 0.2s ease;
    }

    .btn:active {
      transform: scale(0.97);
    }

    .btn-primary {
      width: 100%;
      background: #2563eb;
      color: white;
    }

    .btn-primary:hover {
      background: #1d4ed8;
    }

    .btn-group {
      display: flex;
      gap: 8px;
    }

    .btn-pause {
      flex: 1;
      background: #f59e0b;
      color: white;
    }

    .btn-pause:hover {
      background: #d97706;
    }

    .btn-stop {
      flex: 1;
      background: #ef4444;
      color: white;
    }

    .btn-stop:hover {
      background: #dc2626;
    }

    .info-note {
      font-size: 11px;
      line-height: 1.4;
      color: var(--note-text);
      background: var(--note-bg);
      padding: 8px 10px;
      border-radius: 6px;
      border-left: 3px solid var(--note-border);
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="header-title">
      <span>📸</span>
      <span>FullPage Capture</span>
    </div>
    <button id="themeToggle" class="theme-toggle-btn" title="Toggle Dark/Light Mode">🌙</button>
  </div>

  <div class="content">
    <div class="status-title">
      <span id="statusText">Ready to capture</span>
      <span id="percentText" class="percent-badge">0%</span>
    </div>

    <div class="blocks-container" id="blocksContainer"></div>

    <!-- منطقة أزرار التحكم -->
    <div class="controls">
      <!-- كيبان فـ اللول قبل ما تبدا -->
      <button id="startBtn" class="btn btn-primary">▶ Start Capture</button>

      <!-- كيبانو ملي كيبدا السكرين -->
      <div id="activeControls" class="btn-group" style="display: none;">
        <button id="pauseBtn" class="btn btn-pause">⏸ Pause</button>
        <button id="stopBtn" class="btn btn-stop">⏹ Stop</button>
      </div>
    </div>

    <div class="info-note">
      ⚡ <b>Note:</b> Click "Start" when you are ready. Keep this popup visible during capture.
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
